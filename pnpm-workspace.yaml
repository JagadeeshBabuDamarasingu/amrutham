packages:
  - "apps/web"

# The Flutter app (apps/mobile) has no package.json and is not a workspace
# member; the Flutter/Dart toolchain manages it. Root scripts wrap its
# commands (dev:mobile, test:mobile, build:apk, ...).

allowBuilds:
  esbuild: true
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"
